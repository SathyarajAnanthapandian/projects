# qa environment. Run with: --env=qa
# Replace the placeholder values below with your qa resources.

project=my-qa-project
inputTable=my-qa-project:my_dataset.my_table
outputTopic=projects/my-qa-project/topics/my-topic

# Use a query instead of inputTable if you only need some rows (set one or the other, not both):
# query=SELECT headers, requestPayload FROM `my-qa-project.my_dataset.my_table` WHERE ...

# Only needed with runner=DataflowRunner:
region=us-central1
tempLocation=gs://my-qa-bucket/temp
