# prod environment. Run with: --env=prod
# Replace the placeholder values below with your prod resources.

project=my-prod-project
inputTable=my-prod-project:my_dataset.my_table
outputTopic=projects/my-prod-project/topics/my-topic

# Use a query instead of inputTable if you only need some rows (set one or the other, not both):
# query=SELECT headers, requestPayload FROM `my-prod-project.my_dataset.my_table` WHERE ...

# Only needed with runner=DataflowRunner:
region=us-central1
tempLocation=gs://my-prod-bucket/temp
